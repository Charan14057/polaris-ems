# ============================================================
# POLARIS-EMS — Render Blueprint Specification
# Polar Energy Management & Resilience System
# ============================================================

services:
  - type: web
    name: polaris-ems
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: POLARIS_ENVIRONMENT
        value: PRODUCTION
      - key: POLARIS_SERVE_FRONTEND
        value: "true"
      - key: POLARIS_FRONTEND_DIST
        value: /app/frontend/dist
      - key: POLARIS_API_HOST
        value: 0.0.0.0
      - key: POLARIS_LOG_LEVEL
        value: INFO
      - key: POLARIS_OPERATOR_MODE
        value: ADVISORY
      - key: POLARIS_CORS_ORIGINS
        value: "https://polaris-ems.onrender.com,https://polaris-ems-demo.onrender.com,http://localhost:5173,http://localhost:3000"
