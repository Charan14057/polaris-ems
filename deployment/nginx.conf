# ============================================================
# POLARIS-EMS — Enterprise Nginx Reverse Proxy Configuration
# SIH26061: Polar Energy Management & Resilience System
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone for API requests
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream polaris_backend {
        server polaris-ems:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name polaris-ems.polar.resilience;

        # Enforce Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http: https:;" always;

        # Gzip compression for static assets
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Root and API Proxy
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://polaris_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Health endpoint bypasses rate limiting for orchestrator probes
        location /health {
            proxy_pass http://polaris_backend/health;
            access_log off;
        }
    }
}
